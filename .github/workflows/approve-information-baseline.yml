name: Approve Information visual baseline

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/approve-information-baseline.yml"

permissions:
  contents: write

jobs:
  approve-information-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install site dependencies
        run: npm ci

      - name: Install pinned Playwright
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build site
        run: npm run build

      - name: Regenerate approved Information baselines only
        run: >
          npx playwright test
          --config=playwright.config.cjs
          --grep "information visual and layout regression"
          --project=desktop-1440
          --project=mobile-390
          --update-snapshots

      - name: Verify only approved baselines changed
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only)
          expected=(
            "tests/visual/visual.spec.cjs-snapshots/information-desktop-1440-linux.png"
            "tests/visual/visual.spec.cjs-snapshots/information-mobile-390-linux.png"
          )
          printf '%s\n' "${changed[@]}" | sort > /tmp/changed.txt
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Commit approved Information baselines
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/visual.spec.cjs-snapshots/information-desktop-1440-linux.png
          git add tests/visual/visual.spec.cjs-snapshots/information-mobile-390-linux.png
          git commit -m "Approve Information readability visual baselines"
          git push origin HEAD:main
