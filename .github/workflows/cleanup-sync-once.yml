name: One-time cleanup sync

on:
  push:
    branches:
      - chore/remove-verified-unused-assets

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[cleanup-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/remove-verified-unused-assets
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Rebuild generated docs
        run: npm run build

      - name: Commit lockfile and generated docs
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json docs; then
            echo "Lockfile and docs already match the cleaned source graph."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A package-lock.json docs
          git commit -m "Regenerate lockfile and docs after cleanup [cleanup-sync]"
          git push origin HEAD:chore/remove-verified-unused-assets
