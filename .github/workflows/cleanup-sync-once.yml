name: One-time legacy cleanup sync

on:
  push:
    branches:
      - cleanup/remove-legacy-webpack-app

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[cleanup-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-legacy-webpack-app
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Rebuild docs
        run: npm run build
      - name: Commit generated cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A package-lock.json docs
          if git diff --cached --quiet; then
            echo "No generated cleanup changes."
            exit 0
          fi
          git commit -m "Sync cleanup lockfile and docs [cleanup-sync]"
          git push origin HEAD:cleanup/remove-legacy-webpack-app
