name: Visual regression

on:
  pull_request:
    branches: ["main"]
  workflow_run:
    workflows: ["Deploy static site to GitHub Pages"]
    types: [completed]
  workflow_dispatch:
    inputs:
      full_audit:
        description: "Run the complete 1440/1280/1024/768/430/390/375 viewport matrix"
        required: false
        default: false
        type: boolean
      limited_reverification:
        description: "Recheck 10 changed images, 2 Gallery controls and the motion lifecycle only"
        required: false
        default: false
        type: boolean
      home_stability_only:
        description: "Run Home 1440 screenshot stability and normal carousel advance only"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: visual-regression-${{ github.event.pull_request.number || github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  visual:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAYWRIGHT_VERSION: "1.63.0"
      VISUAL_FULL: ${{ (github.event_name == 'pull_request' && '1') || (github.event_name == 'workflow_dispatch' && inputs.full_audit && '1') || '0' }}

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install site dependencies
        run: npm ci

      - name: Run repository checks and build
        run: npm run check

      - name: Install pinned Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@${PLAYWRIGHT_VERSION}

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ env.PLAYWRIGHT_VERSION }}

      # Only the disposable GitHub runner is changed; browser/font/test settings stay pinned.
      - name: Bound Ubuntu dependency acquisition
        timeout-minutes: 2
        run: |
          test -f /etc/apt/apt-mirrors.txt
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          printf '%s\n' 'Acquire::Retries "1";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99-portfolio-ci-timeouts >/dev/null

      - name: Install Chromium and system dependencies
        timeout-minutes: 10
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies on cache hit
        timeout-minutes: 10
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Detect visual baseline
        id: baseline
        shell: bash
        run: |
          if find tests/visual/visual.spec.cjs-snapshots -type f -name '*.png' -print -quit 2>/dev/null | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run visual regression
        shell: bash
        run: |
          if [ "${{ steps.baseline.outputs.exists }}" != "true" ]; then
            echo "Committed Linux baselines are required; automatic bootstrap is disabled."
            exit 1
          fi
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.home_stability_only }}" = "true" ]; then
            npx playwright test --config=playwright.config.cjs --update-snapshots=none \
              --project=desktop-1440 --workers=1 \
              --grep '(home visual and layout regression|Home carousel still advances automatically outside screenshot stabilization)$'
          elif [ "${{ github.event_name == 'workflow_dispatch' && inputs.limited_reverification }}" = "true" ]; then
            npx playwright test --config=playwright.config.cjs --update-snapshots=none \
              --project=desktop-1440 --project=mobile-390 --workers=1 \
              --grep '(home|gallery|biography|artist-statement|information|yurayura) visual and layout regression$|VANTA\.TRUNK accent respects reduced motion and motion preference changes$'
          else
            npx playwright test --config=playwright.config.cjs --update-snapshots=none
          fi

      - name: Upload visual evidence
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.home_stability_only) }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-${{ github.event.workflow_run.head_sha || github.sha }}
          path: |
            playwright-report
            test-results/visual
          if-no-files-found: ignore
          retention-days: 14

