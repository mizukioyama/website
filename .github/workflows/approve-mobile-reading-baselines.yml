name: Approve mobile reading baselines

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/approve-mobile-reading-baselines.yml"

permissions:
  contents: write

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm install --no-save --package-lock=false @playwright/test@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: npm run build

      - name: Regenerate approved mobile baselines only
        run: >
          npx playwright test
          --config=playwright.config.cjs
          --grep "biography visual and layout regression|artist-statement visual and layout regression"
          --project=mobile-390
          --update-snapshots

      - name: Restore generated deployment tree
        run: git restore docs

      - name: Verify only approved baselines changed
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only)
          expected=(
            "tests/visual/visual.spec.cjs-snapshots/biography-mobile-390-linux.png"
            "tests/visual/visual.spec.cjs-snapshots/artist-statement-mobile-390-linux.png"
          )
          printf '%s\n' "${changed[@]}" | sort > /tmp/changed.txt
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Commit approved mobile baselines
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/visual.spec.cjs-snapshots/biography-mobile-390-linux.png
          git add tests/visual/visual.spec.cjs-snapshots/artist-statement-mobile-390-linux.png
          git commit -m "Approve mobile reading visual baselines"
          git push origin HEAD:main
