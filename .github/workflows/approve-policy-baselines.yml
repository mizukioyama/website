name: Approve Policy visual baselines

on:
  push:
    branches: ["phase1-policy-baseline-audit"]
    paths:
      - ".github/workflows/approve-policy-baselines.yml"

permissions:
  contents: write

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-policy-baseline-audit

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm install --no-save --package-lock=false @playwright/test@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: npm run build

      - name: Generate approved Policy baselines only
        run: >
          npx playwright test
          --config=playwright.config.cjs
          --grep "policy visual and layout regression"
          --project=desktop-1440
          --project=mobile-390
          --update-snapshots

      - name: Restore generated deployment tree
        run: git restore docs

      - name: Verify only Policy baselines changed
        shell: bash
        run: |
          mapfile -t changed < <(git status --porcelain | sed -E 's/^.. //')
          expected=(
            "tests/visual/visual.spec.cjs-snapshots/policy-desktop-1440-linux.png"
            "tests/visual/visual.spec.cjs-snapshots/policy-mobile-390-linux.png"
          )
          printf '%s\n' "${changed[@]}" | sort > /tmp/changed.txt
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Commit approved Policy baselines
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/visual.spec.cjs-snapshots/policy-desktop-1440-linux.png
          git add tests/visual/visual.spec.cjs-snapshots/policy-mobile-390-linux.png
          git commit -m "Approve Policy visual baselines"
          git push origin HEAD:phase1-policy-baseline-audit
