name: PR55 F4 screenshot comparison
on:
  push:
    branches: [codex/pr55-visual-diagnostics]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 02df170212094ab33e34390817ff804ff889497c
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && npm run check
      - run: npm install --no-save --package-lock=false @playwright/test@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=desktop-1440 --project=mobile-390 --grep '^.*order visual and layout regression$' --repeat-each=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f4-order-linux
          path: test-results/visual
