name: One-time docs sync

on:
  push:
    branches:
      - fix/deterministic-docs-output

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[docs-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/deterministic-docs-output
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build generated site
        run: npm run build

      - name: Commit generated docs
        shell: bash
        run: |
          if git diff --quiet -- docs && git diff --cached --quiet -- docs; then
            echo "docs/ already matches the deterministic build."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          git commit -m "Sync deterministic docs output [docs-sync]"
          git push origin HEAD:fix/deterministic-docs-output
