      const lines = document.querySelectorAll(".page-line");

      const observer = new IntersectionObserver((entries) =&gt; {
        entries.forEach(entry =&gt; {
          const ratio = entry.intersectionRatio; // 0〜1

          if (entry.isIntersecting) {
            // 中心に近づくほど幅が広がる（最大100%）
            const widthPercent = Math.floor(ratio * 100); // 例: 0.4 → 40%
            //entry.target.style.width = `calc(${widthPercent}% - 48px)`;
            entry.target.style.width = `100%`;
          } else {
            // 画面外に出たら0%
            entry.target.style.width = `0%`;
          }
        });
      }, {
        threshold: Array.from({ length: 101 }, (_, i) =&gt; i / 100) // 0〜1まで100段階
      });

      lines.forEach(line =&gt; observer.observe(line));
    });</script><script>let vantaEffect = VANTA.FOG({
      el: "#vanta-bg",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00,
      highlightColor: 0x181818,
      midtoneColor: 0xb3b3b3,
      lowlightColor: 0x3f3ff,
      baseColor: 0xfafffc,
      blurFactor: 0.60,
      speed: 0.45,   // 動きの速さ
      zoom: 0.40
    });

    // === 流れ方向制御（右下 → 左下 の繰り返し） ===
    let directionX = 1; // 右:+1 / 左:-1
    let elapsed = 0;
    const interval = 100;     // 0.1秒ごと
    const switchRight = 25000; // 25秒後に左下へ切り替え
    const switchLeft = 38000;  // 38秒後に右下へ戻す

    setInterval(() =&gt; {
      elapsed += interval;

      if (elapsed &gt;= switchRight &amp;&amp; elapsed &lt; switchLeft) {
        // 左下方向（左へ流す）
        directionX = -1;
      } else if (elapsed &gt;= switchLeft) {
        // 右下方向（右へ流す）
        directionX = 1;
        elapsed = 0;
      }

      // speed と zoom を変化させて流れる方向感を再現
      if (vantaEffect &amp;&amp; vantaEffect.options) {
        const baseSpeed = 0.45;
        const baseZoom = 0.40;

        // X方向で流れを切り替え（speedを擬似的に変化）
        vantaEffect.options.speed = baseSpeed + (directionX * 0.05);

        // zoom をわずかに変化させて“流れ”を感じさせる
        vantaEffect.options.zoom = baseZoom + (Math.sin(performance.now() * 0.0005) * 0.02);
      }

    }, interval);</script></body></html>
