<head>

  <link rel="stylesheet" href="/website/css/noise.css?v=891429b349f3">
  <link rel="stylesheet" href="/website/css/all.css?v=36cde3122266">
  <link rel="stylesheet" href="/website/css/gallery.css?v=21c1596a53b1">
  <link rel="stylesheet" href="/website/css/mobile.css?v=51147c179821">
  <link rel="stylesheet" href="/website/css/footer.css?v=7deecedc7a53">

  <link rel="stylesheet" href="https://use.typekit.net/meg7mel.css">
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@100;300;400;500;700&display=swap" rel="stylesheet">

  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline' https://use.typekit.net https://fonts.googleapis.com;
    font-src 'self' https://use.typekit.net https://p.typekit.net https://fonts.gstatic.com;
    img-src 'self' data:;
    object-src 'none';
    base-uri 'self';
  ">

  <style>
    #langChenge {
      display: none;
    }

    .not-found-page {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 100svh;
      margin: 0;
      padding: clamp(9rem, 16vh, 13rem) clamp(2rem, 9vw, 10rem) clamp(7rem, 12vh, 10rem);
      backdrop-filter: blur(10px);
    }

    .not-found-content {
      display: block;
      width: min(100%, 760px);
    }

    .not-found-code {
      margin: 0 0 1.25rem;
      font-family: "Jost", sans-serif;
      font-size: clamp(var(--font-404-code-min), 12vw, var(--font-404-code-desktop-max));
      font-weight: 100;
      line-height: 0.9;
      letter-spacing: clamp(-5.04px, -0.48vw, -2.24px);
      color: var(--inv, #e6e6e6);
    }

    .not-found-title {
      margin: 0;
      font-size: clamp(var(--legacy-px-1_5), calc(var(--legacy-px-1_15) + 1.3vw), var(--font-404-title-max));
      font-weight: 300;
      line-height: 1.35;
      color: var(--inv, #e6e6e6);
      background: none;
      -webkit-text-fill-color: currentColor;
    }

    .not-found-message {
      width: min(100%, 36rem);
      margin-top: 2rem;
      line-height: 2;
      color: var(--inv, #e6e6e6);
    }

    .not-found-links {
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem 2rem;
      width: 100%;
      margin-top: 3.5rem;
    }

    .not-found-links a {
      display: inline-block;
      width: fit-content;
      padding: 0.4rem 0;
      border-bottom: 1px solid currentColor;
      font-family: "Jost", sans-serif;
      font-size: clamp(var(--legacy-px-1), calc(var(--legacy-px-0_9) + 0.25vw), var(--legacy-px-1_15));
      line-height: 1.5;
    }

    .not-found-links a:first-child {
      font-weight: 500;
    }

    .not-found-links a:focus-visible {
      outline: 1px solid currentColor;
      outline-offset: 0.4rem;
    }

    @media screen and (min-width: 600px) and (max-width: 899px) {
      .not-found-code {
        letter-spacing: clamp(calc(-3.744px - 0.144vw), -0.48vw, calc(-1.664px - 0.064vw));
      }
    }

    @media screen and (max-width: 599px) {
      .not-found-page {
        min-height: 100svh;
        padding: 8rem 2.5rem 8rem;
        backdrop-filter: blur(10px);
      }

      .not-found-code {
        font-size: clamp(var(--font-404-code-min), 25vw, var(--font-404-code-mobile-max));
        letter-spacing: clamp(-4.48px, -1vw, -2.56px);
      }

      .not-found-message {
        line-height: 1.9;
      }

      .not-found-links {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
        margin-top: 3rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .not-found-page *,
      .not-found-page *::before,
      .not-found-page *::after {
        scroll-behavior: auto !important;
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body id="not-found">
  <div id="header-container"></div>

  <main class="not-found-page">
    <section class="not-found-content" aria-labelledby="not-found-title">
      <p class="not-found-code" aria-hidden="true">404</p>
      <h1 id="not-found-title" class="not-found-title">Page not found</h1>
      <p class="not-found-message">
        お探しのページは、移動または削除された可能性があります。
      </p>

      <div class="not-found-links" role="navigation" aria-label="主要ページ">
        <a href="/website/">Home</a>
        <a href="/website/gallery.html">Gallery</a>
        <a href="/website/information.html">Information</a>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script src="/website/js/menu.js?v=2b720f998aa8"></script>
</body>
</html>
