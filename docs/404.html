  <style>
    #langChenge {
      display: none;
    }

    .not-found-page {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 100svh;
      margin: 0;
      padding: clamp(9rem, 16vh, 13rem) clamp(2rem, 9vw, 10rem) clamp(7rem, 12vh, 10rem);
      backdrop-filter: blur(10px);
    }

    .not-found-content {
      display: block;
      width: min(100%, 760px);
    }

    .not-found-code {
      margin: 0 0 1.25rem;
      font-family: "Jost", sans-serif;
      font-size: clamp(var(--font-404-code-min), 12vw, var(--font-404-code-desktop-max));
      font-weight: 100;
      line-height: 0.9;
      letter-spacing: clamp(-5.04px, -0.48vw, -2.24px);
      color: var(--inv, #e6e6e6);
    }

    .not-found-title {
      margin: 0;
      font-size: clamp(var(--legacy-px-1_5), calc(var(--legacy-px-1_15) + 1.3vw), var(--font-404-title-max));
      line-height: 1.35;
      color: var(--inv, #e6e6e6);
      background: none;
      -webkit-text-fill-color: currentColor;
    }

    .not-found-message {
      width: min(100%, 36rem);
      margin-top: 2rem;
      line-height: 2;
      color: var(--inv, #e6e6e6);
    }

    .not-found-links {
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem 2rem;
      width: 100%;
      margin-top: 3.5rem;
    }

    .not-found-links a {
      /* Liquid glass, same design as the TOP NEXT button
         (Mizuki 2026-11-20). */
      position: relative;
      display: inline-block;
      width: fit-content;
      padding: 0.55rem 1.3rem;
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0);
      -webkit-backdrop-filter: blur(12px) saturate(1.25);
      backdrop-filter: blur(12px) saturate(1.25);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.65), 0 8px 20px rgba(0, 0, 0, 0.18);
      font-family: "Jost", sans-serif;
      font-size: clamp(var(--legacy-px-1), calc(var(--legacy-px-0_9) + 0.25vw), var(--legacy-px-1_15));
      line-height: 1.5;
      text-decoration: none;
      transition: transform 250ms ease, border-color 250ms ease, box-shadow 250ms ease;
    }

    .not-found-links a::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        border-radius: inherit;
        /* Explicit size: the all.css reset's fit-content width
           otherwise collapses this layer to a 3px strip. */
        width: 100%;
        height: 100%;
        padding: 1.5px;
        background: conic-gradient(from 210deg,
          rgba(93, 220, 255, 0.95), rgba(249, 250, 251, 0.95),
          rgba(60, 103, 227, 0.95), rgba(16, 25, 24, 0.95),
          rgba(93, 220, 255, 0.95), rgba(249, 250, 251, 0.95),
          rgba(60, 103, 227, 0.95), rgba(16, 25, 24, 0.95),
          rgba(93, 220, 255, 0.95));
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        mask-composite: exclude;
        opacity: 0.3;
        pointer-events: none;
        transition: opacity 250ms ease;
      }

    .not-found-links a:hover {
      border-color: rgba(255, 255, 255, 0.9);
    }

    .not-found-links a:hover::before {
      opacity: 0.55;
    }

    @media (hover: hover) and (pointer: fine) {
      .not-found-links a:hover {
        transform: scale(1.05);
      }
    }

    .not-found-links a:active {
      transform: scale(0.95);
      transition-duration: 100ms;
    }

    @media (prefers-reduced-motion: reduce) {
      .not-found-links a {
        transition: none;
      }

      .not-found-links a:hover,
      .not-found-links a:active {
        transform: none;
      }
    }

    .not-found-links a:first-child {
      font-weight: 500;
    }

    .not-found-links a:focus-visible {
      outline: 1px solid currentColor;
      outline-offset: 0.4rem;
    }

    @media screen and (min-width: 600px) and (max-width: 899px) {
      .not-found-code {
        letter-spacing: clamp(calc(-3.744px - 0.144vw), -0.48vw, calc(-1.664px - 0.064vw));
      }
    }

    @media screen and (max-width: 599px) {
      .not-found-page {
        min-height: 100svh;
        padding: 8rem 2.5rem 8rem;
        backdrop-filter: blur(10px);
      }

      .not-found-code {
        font-size: clamp(var(--font-404-code-min), 25vw, var(--font-404-code-mobile-max));
        letter-spacing: clamp(-4.48px, -1vw, -2.56px);
      }

      .not-found-message {
        line-height: 1.9;
      }

      .not-found-links {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
        margin-top: 3rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .not-found-page *,
      .not-found-page *::before,
      .not-found-page *::after {
        scroll-behavior: auto !important;
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
