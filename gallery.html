  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const lines = document.querySelectorAll(".page-line");
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const ratio = entry.intersectionRatio;
          if (entry.isIntersecting) {
            entry.target.style.width = `100%`;
          } else {
            entry.target.style.width = `0%`;
          }
        });
      }, { threshold: Array.from({ length: 101 }, (_, i) => i / 100) });
      lines.forEach(line => observer.observe(line));
    });
  </script>

  <script>
    let vantaEffect = VANTA.FOG({
      el: "#vanta-bg",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00,
      highlightColor: 0x181818,
      midtoneColor: 0xb3b3b3,
      lowlightColor: 0x3f3ff,
      baseColor: 0xfafffc,
      blurFactor: 0.60,
      speed: 0.45,
      zoom: 0.40
    });

    let directionX = 1;
    let elapsed = 0;
    const interval = 100;
    const switchRight = 25000;
    const switchLeft = 38000;

    setInterval(() => {
      elapsed += interval;
      if (elapsed >= switchRight && elapsed < switchLeft) directionX = -1;
      else if (elapsed >= switchLeft) { directionX = 1; elapsed = 0; }
      if (vantaEffect && vantaEffect.options) {
        const baseSpeed = 0.45;
        const baseZoom = 0.40;
        vantaEffect.options.speed = baseSpeed + (directionX * 0.05);
        vantaEffect.options.zoom = baseZoom + (Math.sin(performance.now() * 0.0005) * 0.02);
      }
    }, interval);
  </script>
